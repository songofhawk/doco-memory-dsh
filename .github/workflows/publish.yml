name: Publish

# 推送 main 即发布当前版本到 npm（Trusted Publishing / OIDC，无需任何 token）。
# 注意：同版本重复发布会失败（npm 不允许覆盖），发布新版本请先 bump package.json。
# 前置（一次性）：npmjs.com 包设置页 → Trusted Publisher → GitHub Actions：
#   Organization or user: songofhawk | Repository: doco-memory-dsh
#   Workflow filename: publish.yml | Allowed actions: npm publish
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    if: github.repository == 'songofhawk/doco-memory-dsh'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC 可信发布必需
    steps:
      - uses: actions/checkout@v4
      # 注意：不要传 registry-url——它会让 setup-node 导出 NODE_AUTH_TOKEN 机制，
      # 干扰 OIDC 可信发布的自动检测；npm 默认 registry 即 registry.npmjs.org。
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false
      - name: 升级 npm（Trusted Publishing 需要 >= 11.5.1）
        run: npm install -g npm@latest && npm -v
      - run: npm ci
      - run: npm test
      - run: npm publish
