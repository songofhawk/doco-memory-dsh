name: Publish

# 推送 main 即发布当前版本到 npm（Trusted Publishing / OIDC，无需任何 token）。
# 版本未变时自动跳过 publish 步骤，不会因「同版本不可覆盖」而报错；
# 发布新版本只需 bump package.json 后推送。
# 前置（已完成）：npmjs.com 包设置页 → Trusted Publisher → GitHub Actions：
#   songofhawk / doco-memory-dsh / publish.yml / Environment 留空 / 允许 npm publish。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    if: github.repository == 'songofhawk/doco-memory-dsh'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC 可信发布必需
    steps:
      - uses: actions/checkout@v4
      # 注意：不要传 registry-url——它会让 setup-node 导出 NODE_AUTH_TOKEN 机制，
      # 干扰 OIDC 可信发布的自动检测；npm 默认 registry 即 registry.npmjs.org。
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 升级 npm（Trusted Publishing 需要 >= 11.5.1）
        run: npm install -g npm@latest && npm -v
      - run: npm ci
      - run: npm test
      - name: 检查版本是否已发布
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "doco-memory-dsh@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "版本 $VERSION 已在 npm 上，跳过 publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm publish
        if: steps.check.outputs.published != 'true'
